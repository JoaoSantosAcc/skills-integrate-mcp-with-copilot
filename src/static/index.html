<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="auth-button" class="auth-button" type="button" aria-label="Log in as a teacher">
        <span aria-hidden="true">👤</span>
        <span id="auth-button-label">Teacher login</span>
      </button>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-heading">
      <form id="login-form">
        <h2 id="login-heading">Teacher sign in</h2>
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input id="teacher-username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input id="teacher-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="dialog-actions">
          <button type="submit">Sign in</button>
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
        </div>
        <p id="login-message" class="hidden" role="alert"></p>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
